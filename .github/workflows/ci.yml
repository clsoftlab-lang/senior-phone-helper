name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Verify (JSON + JS syntax + a11y contract)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run checks
        run: node check.mjs

      - name: Syntax-check all JS explicitly
        run: |
          for f in $(find . -name '*.js' -o -name '*.mjs' | grep -v node_modules); do
            echo "node --check $f"
            node --check "$f"
          done
