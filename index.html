  도전 (도움전화) — senior-friendly phone helper. DEMO mode only.
-->
<html lang="ko" data-contrast="normal" data-voice="on">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="도전(도움전화) — 어르신을 위한 큰 글씨·큰 단추 전화 도우미 앱. 음성 안내, 사용법 튜토리얼, 긴급 SOS. 데모.">
  <meta name="theme-color" content="#1d4ed8">
  <title>도전 (도움전화) · 어르신 전화 도우미</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>📞</text></svg>">
</head>
<body>
  <a class="skip-link" href="#app">본문으로 건너뛰기</a>

  <!-- Top app bar: big back button + app name -->
  <header class="app-bar" role="banner">
    <button id="back-btn" type="button" class="bar-btn back" aria-label="뒤로 가기">
      <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true" focusable="false">
        <path d="M15 5 8 12l7 7" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>뒤로</span>
    </button>
    <h1 class="app-name">도전 <span class="app-sub">도움전화</span></h1>
    <a class="bar-btn home" href="#/" aria-label="첫 화면(홈)으로 가기">
      <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true" focusable="false">
        <path d="M4 11 12 4l8 7M6 10v9h12v-9" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>홈</span>
    </a>
  </header>

  <!-- Main content: rendered by app.js -->
  <main id="app" class="app-main" tabindex="-1" aria-busy="true" aria-live="off">
    <p class="loading">불러오는 중이에요...</p>
  </main>

  <!-- Bottom tab navigation (large tap targets) -->
  <nav class="tab-bar" aria-label="주요 메뉴">
    <a class="nav-item" href="#/" data-match="home" data-label="홈" aria-current="page">
      <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" focusable="false"><path d="M4 11 12 4l8 7M6 10v9h12v-9" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>홈</span>
    </a>
    <a class="nav-item" href="#/tutorials" data-match="tutorials" data-label="사용법 배우기">
      <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" focusable="false"><path d="M8 7h11M8 12h11M8 17h11" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="4.5" cy="7" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="17" r="1.2" fill="currentColor"/></svg>
      <span>사용법</span>
    </a>
    <a class="nav-item nav-sos" href="#/sos" data-match="sos" data-label="긴급 도움">
      <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.2" fill="none"/><path d="M12 7v6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="16.3" r="1.2" fill="currentColor"/></svg>
      <span>긴급</span>
    </a>
    <a class="nav-item" href="#/settings" data-match="settings" data-label="설정">
      <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2.2" fill="none"/><path d="M12 3v2.5M12 18.5V21M4.2 7l2.2 1.3M17.6 15.7 19.8 17M4.2 17l2.2-1.3M17.6 8.3 19.8 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span>설정</span>
    </a>
  </nav>

  <!-- Screen-reader / status live region -->
  <div id="announcer" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
